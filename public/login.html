<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Vision Score</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main>
        <div id="cabecalho-container">
            <img src="../public/assets/logoVisionScore.png" alt="Logo Vision Score" id="logo">

            <h2 id="subtitulo">Entre em sua conta</h2>
        </div>

        <div id="inputs-container">
            <input type="text" placeholder="Email ou telefone" id="input-email">

            <input type="password" placeholder="Senha" id="input-senha">
        </div>

        <div id="direcionadores-container">
            <button>Acessar conta</button>

            <a href="./cadastro.html">Criar conta</a>
        </div>
    </main>
</body>

</html>
