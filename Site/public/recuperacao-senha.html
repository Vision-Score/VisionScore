<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de senha Vision Score</title>
    <link rel="stylesheet" href="css/recuperacao-senha.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <div id="cabecalho-container">
            <img id="logo" src="./assets/imgs/logo_branca.png" alt="Logo Vision Score">

            <h2 id="subtitulo">Recuperação de senha</h2>
        </div>

        <p id="descricao">
            Para fazer a recuperação da sua senha, informe-nos seu e-mail e te enviaremos o código para realizar a

        <input type="email" placeholder="E-mail">

        <div id="direcionadores-container">
            <button>Enviar</button>

            <a href="./login.html">Cancelar</a>
        </div>
    </main>
