<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="../css/dashboards.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="../css/editar-contas.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=groups" />
    <script src="../js/renderComponents.js"></script>
</head>

<body>
    <div class="main">
        <div id="sidebarContainer">
        </div>
        <div class="header">
            <div class="burgerMenu" onclick="switchSidebar()">
                <i class="material-icons">menu</i>
            </div>
        </div>
        <div class="content">
            <div class="mainContainer">
                <div class="editar-contas-header">
                    <div class="editar-contas-title">Usuários</div>

                    <div class="editar-contas-interactibles">
                        <div class="search-bar">
                            <input type="text" id="searchInput" placeholder="Buscar por nome ou id">
                            <i class="material-icons">search</i>
                        </div>
                        <button class="add-user-btn" onclick="abrirModalCriarConta()"> + <i
                                class="material-icons">person</i></button>
                    </div>

                </div>
                <div class="editar-contas-content">
                    <div class="editar-contas-menu-filtro">
                        <div id="id">Id</div>
                        <div id="foto">Foto</div>
                        <div id="nome">Nome</div>
                        <div id="equipe">Cargo</div>
                        <div id="status">Status</div>
                        <div id="acoes">Ações</div>
                    </div>
                    <div class="editar-contas-user-list" id="editarContasContainer">

                        

                    </div>
                    <div class="editar-contas-pagination" id="editarContasPagination">


                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Editar Usuário -->
    <div class="editar-contas-modal-fundo" id="modalEditarFundo" onclick="fecharModalEditar()">
        <div class="editar-contas-modal-editar" onclick="event.stopPropagation()">
            <div class="editar-contas-modal-foto">
                <img src="../assets/playerIcons/faker.png" alt="Foto do usuário">
            </div>
            <div class="editar-contas-modal-form">
                <div class="editar-contas-modal-campo">
                    <label>Nome:</label>
                    <input type="text" id="editarNome">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Cargo:</label>
                    <select id="editarCargo">
                        <option selected value="2">Treinador</option>
                        <option value="3">Jogador</option>
                    </select>
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Email:</label>
                    <input type="email" id="editarEmail">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Telefone:</label>
                    <input type="text" id="editarTelefone">
                </div>
                <div class="editar-contas-modal-status">
                    <div class="editar-contas-modal-toggle" id="toggleAtivo" onclick="toggleStatus()">
                        <div class="editar-contas-modal-toggle-thumb"></div>
                    </div>
                    <span class="editar-contas-modal-toggle-label">Recebe notificações?</span>
                </div>
                <div id="editarError" style="color:#c92a2a; margin-top:8px; display:none; font-size:0.95rem;"></div>
            </div>
            <button class="editar-contas-modal-btn-salvar" onclick="salvarEdicao()">Salvar</button>
        </div>
    </div>

    <!-- Modal Criar Conta -->
    <div class="editar-contas-modal-fundo" id="modalCriarFundo" onclick="fecharModalCriarConta()">
        <div class="editar-contas-modal-editar" onclick="event.stopPropagation()">
            <div class="editar-contas-modal-foto">
                <img src="../assets/playerIcons/faker.png" alt="Foto do usuário">
            </div>
            <div class="editar-contas-modal-form">
                <div class="editar-contas-modal-campo">
                    <label>Nome:</label>
                    <input type="text" id="criarNome">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Cargo:</label>
                    <select id="criarCargo">
                        <option value="2">Treinador</option>
                        <option value="3">Jogador</option>
                    </select>
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Email:</label>
                    <input type="email" id="criarEmail">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Telefone:</label>
                    <input type="text" id="criarTelefone">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Senha:</label>
                    <input type="password" id="criarSenha">
                </div>
                <div id="criarError" style="color:#c92a2a; margin-top:8px; display:none; font-size:0.95rem;"></div>
            </div>
            <div style="display:flex; width:100%; justify-content:flex-end; gap:10px;">
                <button class="editar-contas-modal-btn-cancelar" onclick="fecharModalCriarConta()">Cancelar</button>
                <button class="editar-contas-modal-btn-salvar" onclick="criarConta()">Criar Conta</button>
            </div>
        </div>
    </div>

    

    <!-- Modal Excluir Usuário -->
    <div class="editar-contas-modal-fundo" id="modalExcluirFundo" onclick="fecharModalExcluir()">
        <div class="editar-contas-modal-excluir" onclick="event.stopPropagation()">
            <p>Tem Certeza que deseja apagar este Usuario?</p>
            <div class="editar-contas-modal-excluir-btns">
                <button class="editar-contas-modal-btn-cancelar" onclick="fecharModalExcluir()">Cancelar</button>
                <button class="editar-contas-modal-btn-confirmar" onclick="confirmarDelecao()">Sim, Apagar!</button>
            </div>
        </div>
    </div>

    <div class="loader" id="loaderEditarContas"><span></span></div>
    <script src="../js/editar-contas.js"></script>

</body>

</html>
