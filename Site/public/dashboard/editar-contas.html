<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="../css/dashboards.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="../css/editar-contas.css">
    <script src="../js/renderComponents.js"></script>
</head>

<body>
    <div class="main">
        <div id="sidebarContainer">
        </div>
        <div class="header">
            <div class="burgerMenu" onclick="switchSidebar()">
                <i class="material-icons">menu</i>
            </div>
        </div>
        <div class="content">
            <div class="mainContainer">
                <div class="editar-contas-header">
                    <div class="editar-contas-title">Usuários</div>

                    <div class="editar-contas-interactibles">
                        <div class="search-bar">
                            <input type="text" id="searchInput" placeholder="Buscar por nome ou tag">
                            <i class="material-icons">search</i>
                        </div>
                        <button class="add-user-btn" onclick="abrirModalCriarConta()"> + <i
                                class="material-icons">person</i></button>
                    </div>
                    
                </div>
                <div class="editar-contas-content">
                    <div class="editar-contas-menu-filtro">
                        <div id="id">Id</div>
                        <div id="foto">Foto</div>
                        <div id="nome">Nome</div>
                        <div id="equipe">Equipe</div>
                        <div id="status">Status</div>
                        <div id="acoes">Ações</div>
                    </div>
                    <div class="editar-contas-user-list">
                        <div class="editar-contas-user">
                            <div class="id">id: 001</div>
                            <div class="foto"><img src="../assets/playerIcons/faker.png" alt=""></div>
                            <div class="nome">Faker</div>
                            <div class="equipe"><img src="../assets/icons/intzlogo.png" alt="INTZ"></div>
                            <div class="status"><span class="editar-contas-status-badge ativo">Ativo</span></div>
                            <div class="acoes">
                                <button class="editar-contas-btn-editar" onclick="abrirModalEditar()">Editar</button>
                                <button class="editar-contas-btn-excluir" onclick="abrirModalExcluir()">Deletar</button>
                            </div>
                        </div>
                        <div class="editar-contas-user">
                            <div class="id">id: 001</div>
                            <div class="foto"><img src="../assets/playerIcons/faker.png" alt=""></div>
                            <div class="nome">Faker</div>
                            <div class="equipe"><img src="../assets/icons/intzlogo.png" alt="INTZ"></div>
                            <div class="status"><span class="editar-contas-status-badge ativo">Ativo</span></div>
                            <div class="acoes">
                                <button class="editar-contas-btn-editar" onclick="abrirModalEditar()">Editar</button>
                                <button class="editar-contas-btn-excluir" onclick="abrirModalExcluir()">Deletar</button>
                            </div>
                        </div>
                        <div class="editar-contas-user">
                            <div class="id">id: 001</div>
                            <div class="foto"><img src="../assets/playerIcons/faker.png" alt=""></div>
                            <div class="nome">Faker</div>
                            <div class="equipe"><img src="../assets/icons/intzlogo.png" alt="INTZ"></div>
                            <div class="status"><span class="editar-contas-status-badge inativo">Inativo</span></div>
                            <div class="acoes">
                                <button class="editar-contas-btn-editar" onclick="abrirModalEditar()">Editar</button>
                                <button class="editar-contas-btn-excluir" onclick="abrirModalExcluir()">Deletar</button>
                            </div>
                        </div>
                        <div class="editar-contas-user">
                            <div class="id">id: 001</div>
                            <div class="foto"><img src="../assets/playerIcons/faker.png" alt=""></div>
                            <div class="nome">Faker</div>
                            <div class="equipe"><img src="../assets/icons/intzlogo.png" alt="INTZ"></div>
                            <div class="status"><span class="editar-contas-status-badge ativo">Ativo</span></div>
                            <div class="acoes">
                                <button class="editar-contas-btn-editar" onclick="abrirModalEditar()">Editar</button>
                                <button class="editar-contas-btn-excluir" onclick="abrirModalExcluir()">Deletar</button>
                            </div>
                        </div>
                        <div class="editar-contas-user">
                            <div class="id">id: 001</div>
                            <div class="foto"><img src="../assets/playerIcons/faker.png" alt=""></div>
                            <div class="nome">Faker</div>
                            <div class="equipe"><img src="../assets/icons/intzlogo.png" alt="INTZ"></div>
                            <div class="status"><span class="editar-contas-status-badge inativo">Inativo</span></div>
                            <div class="acoes">
                                <button class="editar-contas-btn-editar" onclick="abrirModalEditar()">Editar</button>
                                <button class="editar-contas-btn-excluir" onclick="abrirModalExcluir()">Deletar</button>
                            </div>
                        </div>
                    </div>
                    <div class="editar-contas-pagination">
                        <div class="editar-contas-pagination-item active">1</div>
                        <div class="editar-contas-pagination-item">2</div>
                        <div class="editar-contas-pagination-item">3</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Editar Usuário -->
    <div class="editar-contas-modal-fundo" id="modalEditarFundo" onclick="fecharModalEditar()">
        <div class="editar-contas-modal-editar" onclick="event.stopPropagation()">
            <div class="editar-contas-modal-foto">
                <img src="../assets/playerIcons/faker.png" alt="Foto do usuário">
            </div>
            <div class="editar-contas-modal-form">
                <div class="editar-contas-modal-campo">
                    <label>Nome:</label>
                    <input type="text">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Equipe:</label>
                    <select>
                        <option selected disabled value="Selecione">Selecione</option>
                        <option value="intz">INTZ</option>
                    </select>
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Email:</label>
                    <input type="email">
                </div>
                <div class="editar-contas-modal-campo">
                    <label>Senha:</label>
                    <input type="password">
                </div>
                <div class="editar-contas-modal-status">
                    <div class="editar-contas-modal-toggle" id="toggleAtivo" onclick="toggleStatus()">
                        <div class="editar-contas-modal-toggle-thumb"></div>
                    </div>
                    <span class="editar-contas-modal-toggle-label">Ativo</span>
                </div>
            </div>
            <button class="editar-contas-modal-btn-salvar">Salvar</button>
        </div>
    </div>

    <!-- Modal Excluir Usuário -->
    <div class="editar-contas-modal-fundo" id="modalExcluirFundo" onclick="fecharModalExcluir()">
        <div class="editar-contas-modal-excluir" onclick="event.stopPropagation()">
            <p>Tem Certeza que deseja apagar este Usuario?</p>
            <div class="editar-contas-modal-excluir-btns">
                <button class="editar-contas-modal-btn-cancelar" onclick="fecharModalExcluir()">Cancelar</button>
                <button class="editar-contas-modal-btn-confirmar">Sim, Apagar!</button>
            </div>
        </div>
    </div>

</body>

</html>

<script>
    renderSidebar(document.getElementById("sidebarContainer"), "", {
        name: "Mitohara",
        role: "Coach",
        imageUrl: "../assets/playerIcons/faker.png",
        nameTeam: "T1",
        logoUrl: "../assets/icons/t1logo.png"
    });

    function switchSidebar() {
        document.getElementById("sbBackdrop").classList.toggle("sb-hidden");
    }

    function abrirModalEditar() {
        document.getElementById("modalEditarFundo").classList.add("editar-contas-modal-visivel");
    }

    function fecharModalEditar() {
        document.getElementById("modalEditarFundo").classList.remove("editar-contas-modal-visivel");
    }

    function abrirModalExcluir() {
        document.getElementById("modalExcluirFundo").classList.add("editar-contas-modal-visivel");
    }

    function fecharModalExcluir() {
        document.getElementById("modalExcluirFundo").classList.remove("editar-contas-modal-visivel");
    }

    function toggleStatus() {
        document.getElementById("toggleAtivo").classList.toggle("ativo");
    }
</script>
