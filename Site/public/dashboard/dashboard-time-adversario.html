<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard-time.css">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="../css/dashboard-time-adversario.css">
    <link rel="stylesheet" href="../css/popup-jogador.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=progress_activity" />
    <script src="../js/renderComponents.js"></script>
    <script src="../js/criarObjetos.js"></script>
</head>

<body>
    <div class="main">
        <div class="loader" style="display: none;">
            <span class="material-symbols-outlined">
                progress_activity
            </span>
        </div>
        <div id="sidebarContainer">
        </div>
        <div id="teamListContainer">
        </div>
        <div class="header">
            <div class="burgerMenu" onclick="switchSidebar()">
                <i class="material-icons">menu</i>
            </div>
            <div id="teamProfile" style="width: 20%; height: 90%; margin-left: 5%;">
            </div>
            <div class="navBar">
                <button onclick="window.location.href = 'dashboard.html'">Visão geral</button>
                <button onclick="window.location.href = 'dashboard-time.html'">Meu Time</button>
            </div>
            <div class="viewTeams" onclick="switchTeamList()">
                <i class="material-icons">filter_alt</i>
            </div>
        </div>
        <div class="content">
            <div class="contentTitle">Como o adversário tem performado?</div>
            <div class="mainContainer">
                <div class="mainContainerUpper">
                    <div class="kpisContainer">
                        <div class="kpi">
                            <div class="tituloKpi">Dano por gold</div>
                            <div class="conteudoKpi" id="dadoKpiDPG"></div>
                            <div class="subtituloKpi" id="mediaDPG"></div>
                        </div>
                        <div class="kpi">
                            <div class="tituloKpi">Taxa de vitória</div>
                            <div class="conteudoKpi" id="dadoKpiVT"></div>
                            <div class="subtituloKpi" id="mediaVT"></div>
                        </div>
                        <div class="kpi">
                            <div class="tituloKpi">Objetivos por jogo</div>
                            <div class="conteudoKpi" id="dadoKpiObj"></div>
                            <div class="subtituloKpi" id="mediaObj"></div>
                        </div>
                    </div>
                    <div class="gameIdentity">
                        <div class="gameIdentityTitle">Perfil do Time</div>
                        <div class="gameIdentityContent">
                            <div class="teamChartWrapper">
                                <canvas id="teamRadarChartAdv"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mainContainerLower">
                    <div class="mainKPIs">
                        <div class="kpi">
                            <div class="tituloKpi">Visão por minuto</div>
                            <div class="conteudoKpi" id="dadoKpiVPV"></div>
                            <div class="subtituloKpi" id="mediaVPV"></div>
                        </div>
                        <div class="kpi">
                            <div class="tituloKpi">Jogos com <br> First Blood</div>
                            <div class="conteudoKpi" id="dadoKpiFB"></div>
                            <div class="subtituloKpi" id="mediaFB"></div>
                        </div>
                        <div class="kpi">
                            <div class="tituloKpi">Conversão <br> objetivo-vitória</div>
                            <div class="conteudoKpi" id="dadoKpiCOV"></div>
                            <div class="subtituloKpi" id="mediaCOV"></div>
                        </div>
                    </div>
                    <div class="strategiesContainer">
                        <div class="strategiesTitle">Elenco <span class="subTitle">e sugestão de Ban</span></div>
                        <div class="adversaryCardsRow">
                            <div class="adversaryCard" id="adversaryCard1">
                                <img src="../assets/icons/Top_icon.png" class="adversaryCardRole">
                                <div class="adversaryCardBody">
                                    <img src="../assets/playerIcons/faker.png" class="adversaryCardPhoto">
                                    <span class="adversaryCardName">—</span>
                                    <span class="adversaryCardPickLabel">Power pick</span>
                                    <span class="adversaryCardChampion">—</span>
                                </div>
                            </div>
                            <div class="adversaryCard" id="adversaryCard2">
                                <img src="../assets/icons/Jungle_icon.png" class="adversaryCardRole">
                                <div class="adversaryCardBody">
                                    <img src="../assets/playerIcons/faker.png" class="adversaryCardPhoto">
                                    <span class="adversaryCardName">—</span>
                                    <span class="adversaryCardPickLabel">Power pick</span>
                                    <span class="adversaryCardChampion">—</span>
                                </div>
                            </div>
                            <div class="adversaryCard" id="adversaryCard3">
                                <img src="../assets/icons/Mid_icon.png" class="adversaryCardRole">
                                <div class="adversaryCardBody">
                                    <img src="../assets/playerIcons/faker.png" class="adversaryCardPhoto">
                                    <span class="adversaryCardName">—</span>
                                    <span class="adversaryCardPickLabel">Power pick</span>
                                    <span class="adversaryCardChampion">—</span>
                                </div>
                            </div>
                            <div class="adversaryCard" id="adversaryCard4">
                                <img src="../assets/icons/Bot_icon.png" class="adversaryCardRole">
                                <div class="adversaryCardBody">
                                    <img src="../assets/playerIcons/faker.png" class="adversaryCardPhoto">
                                    <span class="adversaryCardName">—</span>
                                    <span class="adversaryCardPickLabel">Power pick</span>
                                    <span class="adversaryCardChampion">—</span>
                                </div>
                            </div>
                            <div class="adversaryCard" id="adversaryCard5">
                                <img src="../assets/icons/Support_icon.png" class="adversaryCardRole">
                                <div class="adversaryCardBody">
                                    <img src="../assets/playerIcons/faker.png" class="adversaryCardPhoto">
                                    <span class="adversaryCardName">—</span>
                                    <span class="adversaryCardPickLabel">Power pick</span>
                                    <span class="adversaryCardChampion">—</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>

<script src="../js/dashboard-time-adversario.js"></script>
