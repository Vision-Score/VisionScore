<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard-time.css">
    <link rel="stylesheet" href="../css/popup-jogador.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=progress_activity" />
</head>

<body>
    <div class="loader" style="display: none;">
        <span class="material-symbols-outlined">
            progress_activity
        </span>
    </div>
    <div class="main">
        <div id="sidebarContainer">
        </div>
        <div id="teamListContainer">
        </div>
        <div id="popupJogador" class="hidden">

        </div>
        <div class="header">
            <div class="burgerMenu" onclick="switchSidebar()">
                <i class="material-icons">menu</i>
            </div>
            <div id="teamProfile" style="width: 20%; height: 90%; margin-left: 5%;">
            </div>
            <div class="navBar">
                <button onclick="window.location.href = 'dashboard.html'">Visão geral</button>
                <button class="active">Meu Time</button>
            </div>
            <div class="viewTeams" onclick="switchTeamList()">
                <i class="material-icons">filter_alt</i>
            </div>
        </div>
        <div class="content">
            <div class="mainContainer">
                <div class="mainContainerUpper">
                    <div class="teamRadarContainer">
                        <div class="teamRadarTitle">Perfil do Time</div>
                        <div class="teamChartWrapper">
                            <canvas id="teamRadarChart"></canvas>
                        </div>
                    </div>
                    <div class="mvp" id="highlight">
                    </div>
                </div>
                <div class="mainContainerLower">
                    <div class="players">
                        <div id="playerCard1" onclick="switchPopupJogador(0)">
                        </div>
                        <div id="playerCard2" onclick="switchPopupJogador(1)">
                        </div>
                        <div id="playerCard3" onclick="switchPopupJogador(2)">
                        </div>
                        <div id="playerCard4" onclick="switchPopupJogador(3)">
                        </div>
                        <div id="playerCard5" onclick="switchPopupJogador(4)">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
        <script src="../js/criarObjetos.js"></script>
        <script src="../js/renderComponents.js"></script>
        <script src="../js/dashboard-time.js"></script>
</body>

</html>
